<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231d2733'/%3E%3Cpath d='M18 47V17h16c8 0 13 5 13 12 0 5-3 9-8 11l9 7H37l-8-7h-1v7H18zm10-16h6c2 0 4-1 4-3s-2-3-4-3h-6v6z' fill='%23fff'/%3E%3C/svg%3E" />
    <title>RTM 场景实验室</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      本地开发用的体验 App ID 注入。**这段仅本地开发用。**

      生产环境（本实验室被嵌进上层网站时）由上层页面自己注入 `window.__ENV__`，
      不应保留这段脚本 —— 见 README「注入契约」一节。

      为什么用 `??=` 而不是直接赋值：上层注入、以及 e2e 注入的占位 App ID，都必须
      优先于这里的默认值。直接赋值会把它们盖掉，注入契约就失效了。

      这个 App ID **没有开启 token 鉴权，只供体验**。接入生产必须换成支持 token 的
      App ID，见 README「三条必读声明」第 3 条。这里不放、也不要放 App Certificate。

      普通 <script> 不是 module，会在下面被 defer 的 module 入口之前执行，
      因此 env 快照读到的一定是这里的结果。
    -->
    <script>
      window.__ENV__ ??= { appId: 'fd5c9856c5ee480d9dfec236ebc58815' };
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
